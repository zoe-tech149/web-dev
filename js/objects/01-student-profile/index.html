<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Profile</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <article>
        <h1>Student Profile</h1>

        <p>Name: <span id="studentName" class="text-span" data-property="name"></span></p>

        <p>Surname: <span id="studentSurname" class="text-span" data-property="surname"></span></p>

        <p>Grade: <span id="studentGrade" class="text-span" data-property="grade"></span></p>

        <p>School: <span id="studentSchool" class="text-span" data-property="school"></span></p>

        <p>Age: <span id="studentAge" class="text-span" data-property="school"></span></p>

        <button id="editProfileBtn">Edit Profile</button>
      </article>
    </main>

    <script src="script.js"></script>
  </body>
</html>
