<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade Checker</title>

    <link rel="stylesheet" href="styles.css">

  </head>

  <body>

    <main>
      
      <h1 class="heading">Grade Checker</h1>
    
      <!-- INPUT -->
      <label for="gradeInput">Grade:</label><br><br>
      <input 
        type="number" 
        id="gradeInput"
        min="0" 
        max="100"
      >
      
      <br><br>
      <!-- EVALUATION  -->
      <button id="checkButton">Check Grade</button>
    
      <!-- RESULTS -->
      <p id="gradeResult"></p>

    </main>

    <script src="script.js"></script>
   
  </body>

</html>
