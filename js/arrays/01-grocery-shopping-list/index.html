<!DOCTYPE html>

<html lang="en">

  <head>

    <!-- Tell the browser which character encoding the document uses. -->
    <meta charset="UTF-8">

    <!-- Make the page responsive on different screen sizes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the text shown in the browser tab. -->
    <title>Grocery Shopping List </title>

    <!-- Connect the HTML document to our CSS file. -->
    <link rel="stylesheet" href="style.css">

  </head>

  <body>

    <!-- Identify the purpose of the application. -->
    <h1>Grocery Shopping List</h1>

    <!-- Provides a place for the user to enter a grocery item -->
    <input 
      id="groceryInput"
      type="text"
      placeholder="Enter a grocery item"
    >

    <!-- Provide a control for adding the entered item. -->
    <button id="addButton">Add</button>

    <!-- Provide a container where JavaScript will display grocery items -->
    <ul id="groceryList"></ul>

    <script src="script.js"></script>
    
  </body>

</html>
