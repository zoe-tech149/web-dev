<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reading Check-In</title>

  </head>

  <body>
    <h1> &#128214 Reading Check-In</h1>

    <p>Record your progress for today's reading session.</p>

    <hr>

    <form >

      <label for="bookTitle">Book title:</label>
      <input 
        type="text"
        id="bookTitle"
        placeholder="Enter the title of your book"
      >

      <label for="pagesRead">Pages read:</label>
      <input 
        type="number"
        id="pagesRead"
        placeholder="Enter number of pages"
        min="1"
      >

      <input type="date">

    </form>
   
  </body>

</html>
